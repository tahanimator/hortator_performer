# Fork (Meat Proxy): build the installable packages on GitHub, so no local JieLi toolchain is needed.
# Runs on every push, or from the Actions tab (Run workflow). The run's artifact holds both packages
# (standard and Bluetooth) and the local web installer site that DRUM_PACKAGE builds alongside them.
name: build firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python with Pillow
        run: pip3 install --break-system-packages Pillow || pip3 install Pillow

      - name: JieLi toolchain (cached)
        id: tc
        uses: actions/cache@v4
        with:
          path: ~/.jieli/toolchain
          key: jieli-toolchain-v2

      - name: Fetch the JieLi toolchain (when the cache has no compiler)
        run: |
          [ -x ~/.jieli/toolchain/pi32v2/bin/clang ] || { rm -rf ~/.jieli/toolchain; sh tools/get_toolchain.sh; }
          ls ~/.jieli/toolchain/pi32v2/bin/clang

      - name: JieLi AC79 SDK
        run: |
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK

      - name: JieLi AC79 SDK V1.2.0 (the Bluetooth libraries the BLE build links, pinned by sha256)
        run: |
          for u in https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git https://github.com/Jieli-Tech/fw-AC79_AIoT_SDK.git; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.0 "$u" ~/ac79-bt-sdk && break
            rm -rf ~/ac79-bt-sdk
          done
          ls ~/ac79-bt-sdk/cpu/wl82/liba/btctrler.a

      - name: Build both packages (standard + Bluetooth)
        env:
          DRUM_PACKAGE: "1"       # write the installable .fwsc (the fork skips it otherwise)
          DRUM_BUNDLE: "1"        # the Bluetooth package too, in its own run
          JIELI_DOCKER: "1"       # the Bluetooth build runs the toolchain in Docker (the SDK mounted at /sdk)
          AC79_BT_SDK: /home/runner/ac79-bt-sdk
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log || {
            tail -40 build.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}' | sed 's/^/::error title=build.sh failed::/'
            echo
            exit 1
          }

      - name: List the outputs
        run: ls -la build/*.fwsc

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: hortator-mute-latch
          path: |
            build/*.fwsc
            build/site/
