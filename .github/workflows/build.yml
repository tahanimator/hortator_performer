# Fork (Meat Proxy): build the installable packages on GitHub, so no local JieLi toolchain is needed.
# Runs on every push, or from the Actions tab (Run workflow). Each job's artifact holds its .fwsc package;
# the standard job's also holds the web installer site that DRUM_PACKAGE builds alongside it, which the pages
# job publishes (main only) at https://tahanimator.github.io/hortator_performer/
name: build firmware

on:
  push:
  workflow_dispatch:

jobs:
  standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python with Pillow
        run: pip3 install --break-system-packages Pillow || pip3 install Pillow

      - name: JieLi toolchain (cached)
        uses: actions/cache@v4
        with:
          path: ~/.jieli/toolchain
          key: jieli-toolchain-v2

      - name: Fetch the JieLi toolchain (when the cache has no compiler)
        run: |
          [ -x ~/.jieli/toolchain/pi32v2/bin/clang ] || { rm -rf ~/.jieli/toolchain; sh tools/get_toolchain.sh; }
          ls ~/.jieli/toolchain/pi32v2/bin/clang

      - name: JieLi AC79 SDK
        run: |
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK

      - name: Build the standard package
        env:
          DRUM_PACKAGE: "1"       # write the installable .fwsc (the fork skips it otherwise)
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log || {
            tail -40 build.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}' | sed 's/^/::error title=build.sh failed::/'
            echo
            exit 1
          }
          ls -la build/*.fwsc

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: hortator-mute-latch-standard
          path: |
            build/*.fwsc
            build/site/

      - name: Hand the installer site to Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  # The web installer (Chrome / Edge, Web MIDI over the FM-1's USB cable) with this fork's package, at
  # https://tahanimator.github.io/hortator_performer/ (Settings > Pages > Source: GitHub Actions)
  pages:
    needs: standard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}webapp/installer/
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  bluetooth:
    runs-on: ubuntu-latest
    continue-on-error: true   # its pinned BT library (btctrler.a) does not match the public V1.2.0 copies yet
    steps:
      - uses: actions/checkout@v4

      - name: Python with Pillow
        run: pip3 install --break-system-packages Pillow || pip3 install Pillow

      - name: JieLi toolchain (cached)
        uses: actions/cache@v4
        with:
          path: ~/.jieli/toolchain
          key: jieli-toolchain-v2

      - name: Fetch the JieLi toolchain (when the cache has no compiler)
        run: |
          [ -x ~/.jieli/toolchain/pi32v2/bin/clang ] || { rm -rf ~/.jieli/toolchain; sh tools/get_toolchain.sh; }

      - name: JieLi AC79 SDK
        run: |
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK

      - name: JieLi AC79 SDK V1.2.0 (the Bluetooth libraries, pinned by sha256)
        run: |
          refs=$( { git ls-remote --tags --heads https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git;
                    git ls-remote --tags --heads https://github.com/Jieli-Tech/fw-AC79_AIoT_SDK.git; } 2>&1 \
                  | awk '{print $2}' | sed 's#refs/[a-z]*/##; s/\^{}//' | sort -u )
          ref=$(echo "$refs" | grep -E 'V1\.2\.0' | head -1)
          if [ -z "$ref" ]; then
            echo "::error title=no V1.2.0 ref::$(echo "$refs" | tr '\n' ' ')"
            exit 1
          fi
          echo "using $ref"
          git clone --depth 1 --branch "$ref" https://github.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/ac79-bt-sdk ||
            git clone --depth 1 --branch "$ref" https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/ac79-bt-sdk
          ls ~/ac79-bt-sdk/cpu/wl82/liba/btctrler.a

      - name: Build the Bluetooth package
        env:
          DRUM_PACKAGE: "1"
          FELUCCA_BLE: "1"
          JIELI_DOCKER: "1"       # the Bluetooth build runs the toolchain in Docker (the SDK mounted at /sdk)
          AC79_BT_SDK: /home/runner/ac79-bt-sdk
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log || {
            tail -40 build.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}' | sed 's/^/::error title=build.sh failed::/'
            echo
            exit 1
          }
          ls -la build/*.fwsc

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: hortator-mute-latch-bluetooth
          path: build/*.fwsc
